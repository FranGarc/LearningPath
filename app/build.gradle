android {
    namespace 'com.franciscogarciagarzon.learningpath'
    compileSdk 34

    defaultConfig {
        applicationId "com.franciscogarciagarzon.learningpath"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }


    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11' // needs to match kotlin version as per https://developer.android.com/jetpack/androidx/releases/compose-kotlin?hl=es-419
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }


}

dependencies {

    implementation libs.android.core
    implementation platform(libs.kotlin.bom)
    implementation libs.lifecycle.runtime.ktx

    //compose
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.ui
    implementation libs.androidx.compose.ui.ui.graphics
    implementation libs.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.palette.ktx

    //compose navigation
    implementation libs.androidx.navigation.compose

    // async images
    implementation(libs.coil.compose)
    implementation(libs.coil.kt.coil.svg)

    // retrofit
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.gson
    implementation libs.logging.interceptor
    implementation libs.okhttp

    // dependency injection
    implementation libs.hilt.android
    androidTestImplementation libs.junit.jupiter
    //androidTestImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose

    // room
    implementation libs.room.runtime
    implementation libs.room.coroutines
    ksp libs.room.compiler
// optional - Test helpers
    testImplementation libs.room.testing

    // Test
    testImplementation libs.assertk
    testImplementation libs.junit

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testImplementation libs.junit.jupiter.params

    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}